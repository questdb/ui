name: Check OSS Submodule

on:
  push:

permissions:
  contents: read

jobs:
  check_oss_submodule:
    name: Check if OSS is on master
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          # The depth also applies to the submodule. The check walks
          # ACCEPTABLE_LAG + 2 commits of QuestDB master (the head, the
          # ACCEPTABLE_LAG commits behind it, and one more to stop the walk;
          # see submodule_is_mergeable.py), so the depth must be at least that.
          # A depth of 1 would leave only the head commit and reject every
          # pointer behind it.
          fetch-depth: 10

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check OSS branch
        # pygit2 1.14.1 ships wheels only up to CPython 3.12. On runner images
        # with a newer default Python (ubuntu-26.04 has 3.14), uv would build it
        # from source and fail, because the libgit2 headers are not installed.
        run: |
          uv run --python 3.12 --with "pygit2==1.14.1" submodule_is_mergeable.py
