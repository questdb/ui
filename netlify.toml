[build]
  publish = "dist"

[[redirects]]
  from = "/imp"
  to = "https://demo.questdb.io/imp"
  status = 200
  force = true

[[redirects]]
  from = "/exp"
  to = "https://demo.questdb.io/exp"
  status = 200
  force = true

[[redirects]]
  from = "/exec"
  to = "https://demo.questdb.io/exec"
  status = 200
  force = true

[[redirects]]
  from = "/chk"
  to = "https://demo.questdb.io/chk"
  status = 200
  force = true

[[redirects]]
  from = "/settings"
  to = "https://demo.questdb.io/settings"
  status = 200
  force = true

[[redirects]]
  from = "/warnings"
  to = "https://demo.questdb.io/warnings"
  status = 200
  force = true

[[redirects]]
  from = "/preferences"
  to = "https://demo.questdb.io/preferences"
  status = 200
  force = true

[[redirects]]
  from = "/userinfo"
  to = "https://demo.questdb.io/userinfo"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "https://demo.questdb.io/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://demo.questdb.io/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
